# Боевой остров ugolok.tech. Канон — эта папка в git (deploy/island/).
# Не deploy/compose.yml и не agent/compose as-is.
# Caddy остаётся на хосте. Relay/Blossom только localhost. TURN — host network.

services:
  relay:
    build:
      context: ./relay-src
      dockerfile: ../relay.Dockerfile
    image: ugolok-strfry:local
    container_name: ugolok-relay
    restart: unless-stopped
    volumes:
      - ./strfry.conf:/app/strfry.conf:ro
      - /var/lib/ugolok/relay:/app/strfry-db
    ports:
      - "127.0.0.1:7777:7777"
    mem_limit: 512m

  blossom:
    build:
      context: ./blossom-src
      dockerfile: ../blossom.Dockerfile
    image: ugolok-blossom:local
    container_name: ugolok-blossom
    restart: unless-stopped
    volumes:
      - ./blossom-config.yml:/app/config.yml:ro
      - /var/lib/ugolok/blossom:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 256m

  coturn:
    image: coturn/coturn:4.6.3
    container_name: ugolok-coturn
    restart: unless-stopped
    network_mode: host
    # Образ USER=nobody:nogroup — coturn.conf на хосте chmod 644, иначе
    # turnserver не читает -c и стартует с no-auth / дефолтным диапазоном портов.
    user: "nobody:nogroup"
    volumes:
      - ./coturn.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
    mem_limit: 128m

  # Этап 6 (TZ-cicd-hardening) — выдача временных TURN-кредов (agent/cmd/
  # turncreds-server), TURN_STATIC_AUTH_SECRET — тот же секрет, что
  # static-auth-secret в coturn.conf. turncreds.env в .gitignore, не в git.
  # agent-src — не в git (как relay-src/blossom-src): deploy-env.sh
  # синхронизирует его из своего временного клона перед docker compose up
  # (в отличие от relay-src/blossom-src, освежается на КАЖДЫЙ деплой — это
  # наш код, не сторонний upstream, забутстрапленный один раз).
  turncreds-server:
    build:
      context: ./agent-src
      dockerfile: ../turncreds-server.Dockerfile
    image: ugolok-turncreds-server:local
    container_name: ugolok-turncreds-server
    restart: unless-stopped
    env_file:
      - ./turncreds.env
    ports:
      - "127.0.0.1:8090:8090"
    mem_limit: 32m
