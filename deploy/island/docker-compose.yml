# Боевой остров ugolok.tech. Канон — эта папка в git (deploy/island/).
# Не deploy/compose.yml и не agent/compose as-is.
# Caddy остаётся на хосте. Relay/Blossom только localhost. TURN — host network.

services:
  relay:
    build:
      context: ./relay-src
      dockerfile: ../relay.Dockerfile
    image: ugolok-strfry:local
    container_name: ugolok-relay
    restart: unless-stopped
    # Э-PUSH П0.3(Б)/П1.2 — whitelist-plugin.mjs (server/strfry/push-forward.mjs)
    # читает эти две переменные, чтобы переслать событие push-bridge-server.
    # push-bridge-plugin.env в .gitignore (тот же секрет — PUSH_INTERNAL_TOKEN —
    # в push-bridge.env у push-bridge-server, см. README.md, раздел «Секрет push-моста»).
    # Файл может отсутствовать/быть пустым — тогда forward() в push-forward.mjs
    # тихо ничего не делает (ИП6: без настройки push остров ведёт себя как раньше).
    env_file:
      - ./push-bridge-plugin.env
    volumes:
      - ./strfry.conf:/app/strfry.conf:ro
      - /var/lib/ugolok/relay:/app/strfry-db
      # AUDIT-EGOROD G1/G4: политика записи. policy — код (синхронизируется деплоем),
      # policy-conf — файлы оператора (whitelist/peers/policy.json), править на хосте.
      - ./policy:/app/policy:ro
      - ./policy-conf:/app/policy-conf:ro
    ports:
      - "127.0.0.1:7777:7777"
    mem_limit: 512m
    logging: &logging
      # AUDIT-EGOROD J1/G5: без ограничений json-file растёт без предела (диск),
      # а журнал с IP хранился бы вечно. Небольшое скользящее окно.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--header", "Accept: application/nostr+json", "http://127.0.0.1:7777/"]
      interval: 30s
      timeout: 5s
      retries: 3

  blossom:
    # Готовый образ форка (репозиторий ugolok-blossom, UPSTREAM.md там же).
    # Тег ПИНИТСЯ точно: обновление — осознанная смена этой строки. Откат —
    # возврат прежнего тега и docker compose up -d; данные (том) не затрагиваются.
    image: git.ugolok.tech/naysy/ugolok-blossom:1.2.0
    container_name: ugolok-blossom
    restart: unless-stopped
    volumes:
      - ./blossom-config.yml:/app/config.yml:ro
      # blobs/{hh}/{hash} живёт внутри этого же volume, отдельный том не нужен.
      - /var/lib/ugolok/blossom:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    # 256m при max_upload_size_bytes 300МБ (blossom-config.yml) было
    # несогласовано (FILES-FIX-SPEC.md §8.1, TZ-FIX-FILES-MEDIA-STATIC.md
    # §5.11) — форк грузит блоб целиком в память на каждый Range-запрос,
    # а не только на upload; 256m рядом с файлом, приближающимся к лимиту,
    # реальный риск OOM. Хост 4ГБ — поднято до 512m, не выше остальных
    # сервисов вместе (relay 512m + coturn 128m + turncreds 32m).
    mem_limit: 512m
    logging: *logging
    # /.well-known/health в форке есть, но через Caddy часто 404 (ACME
    # перехватывает .well-known). /stats — живой BUD-эндпоинт без auth.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/stats"]
      interval: 30s
      timeout: 5s
      retries: 3

  coturn:
    image: coturn/coturn:4.6.3
    container_name: ugolok-coturn
    restart: unless-stopped
    network_mode: host
    # Образ USER=nobody:nogroup — coturn.conf на хосте chmod 644, иначе
    # turnserver не читает -c и стартует с no-auth / дефолтным диапазоном портов.
    user: "nobody:nogroup"
    volumes:
      - ./coturn.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
    mem_limit: 128m
    logging: *logging

  # Этап 6 (TZ-cicd-hardening) — выдача временных TURN-кредов (agent/cmd/
  # turncreds-server), TURN_STATIC_AUTH_SECRET — тот же секрет, что
  # static-auth-secret в coturn.conf. turncreds.env в .gitignore, не в git.
  # agent-src — не в git (как relay-src/blossom-src): deploy-env.sh
  # синхронизирует его из своего временного клона перед docker compose up
  # (в отличие от relay-src/blossom-src, освежается на КАЖДЫЙ деплой — это
  # наш код, не сторонний upstream, забутстрапленный один раз).
  turncreds-server:
    build:
      context: ./agent-src
      dockerfile: ../turncreds-server.Dockerfile
    image: ugolok-turncreds-server:local
    container_name: ugolok-turncreds-server
    restart: unless-stopped
    env_file:
      - ./turncreds.env
    ports:
      - "127.0.0.1:8090:8090"
    mem_limit: 32m
    logging: *logging

  # Э-PUSH П1.1 — сервер доставки push. Конфиг — ntfy.yml (в git, ничего
  # секретного). Секрет публикации моста — создаётся once после первого
  # запуска (README.md, раздел ntfy), не в этом compose-файле.
  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    container_name: ugolok-ntfy
    restart: unless-stopped
    command: ["serve"]
    volumes:
      - ./ntfy.yml:/etc/ntfy/server.yml:ro
      - /var/lib/ugolok/ntfy:/var/lib/ntfy
    ports:
      - "127.0.0.1:2586:80"
    mem_limit: 64m
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Э-PUSH П1.2 — мост relay(путь записи)→ntfy. agent-src — общий с
  # turncreds-server (см. коммент выше про освежение на каждый деплой).
  push-bridge-server:
    build:
      context: ./agent-src
      dockerfile: ../push-bridge-server.Dockerfile
    image: ugolok-push-bridge-server:local
    container_name: ugolok-push-bridge-server
    restart: unless-stopped
    depends_on:
      - ntfy
    env_file:
      - ./push-bridge.env
    volumes:
      - /var/lib/ugolok/push-bridge:/app/data
    ports:
      - "127.0.0.1:8091:8091"
    mem_limit: 32m
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8091/health"]
      interval: 30s
      timeout: 5s
      retries: 3
