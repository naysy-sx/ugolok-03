## prod strfry for ugolok.tech — bind docker-bridge, publish only 127.0.0.1
db = "./strfry-db/"

dbParams {
    maxreaders = 256
    mapsize = 10995116277760
    noReadAhead = false
}

events {
    maxEventSize = 65536
    rejectEventsNewerThanSeconds = 900
    rejectEventsOlderThanSeconds = 94608000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    bind = "0.0.0.0"
    port = 7777
    nofiles = 65536
    realIpHeader = "X-Forwarded-For"

    auth {
        enabled = true
        serviceUrl = "wss://relay.ugolok.tech"
    }

    info {
        name = "ugolok"
        description = "Ugolok island relay"
        pubkey = ""
        self = ""
        contact = ""
        icon = ""
        banner = ""
        privacy = ""
        terms = ""
        nips = ""
    }

    maxWebsocketPayloadSize = 131072
    maxReqFilterSize = 200
    autoPingSeconds = 55
    enableTcpKeepalive = true
    queryTimesliceBudgetMicroseconds = 10000
    maxFilterLimit = 10000
    maxTagsPerFilter = 3
    maxFilterLimitCount = 1000000
    maxSubsPerConnection = 200
    maxPendingOutboundBytes = 33554432

    writePolicy {
        # AUDIT-EGOROD G1/G4: лимиты записи по pubkey/IP, «ферма ключей», рубильник
        # mode=readonly. Код плагина и редактируемые оператором файлы монтируются с
        # хоста (docker-compose.yml): /app/policy — код (deploy-env.sh синхронизирует
        # из репозитория), /app/policy-conf — whitelist.json, peers.json, policy.json
        # (правятся на VPS БЕЗ пересборки и перезапуска, перечитываются на каждое
        # событие). Команда с пробелами — strfry не следит за mtime и не
        # перезагружает плагин сам; обновление кода — пересоздание контейнера деплоем.
        plugin = "POLICY_CONF_DIR=/app/policy-conf node /app/policy/server/strfry/whitelist-plugin.mjs"
        timeoutSeconds = 10
    }

    compression {
        enabled = false
        slidingWindow = false
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = true
    }

    numThreads {
        ingester = 2
        reqWorker = 2
        reqMonitor = 2
        negentropy = 1
    }

    negentropy {
        enabled = true
        maxSyncEvents = 1000000
    }

    filterValidation {
        enabled = false
        maxFiltersPerReq = 3
        minFiltersPerReq = 1
        maxKindsPerFilter = 3
        allowedKinds = ""
        requireAuthorOrTag = false
    }
}
