<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Уголок — Результаты поиска</title>
<style>
/* ================================================================== *
 *  ВЫДЕРЖКА из minimal.css — только то, что нужно макету.            *
 *  В проекте ничего из этого блока копировать НЕ НАДО.               *
 * ================================================================== */
@layer reset, tokens, base, elements, utilities, composition;

@layer reset {
	*,*::before,*::after{box-sizing:border-box;min-width:0;border:0 solid;background-repeat:no-repeat}
	:where(:not(dialog)){margin:0;padding:0}
	html{-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent;tab-size:4}
	h1,h2,h3,h4,h5,h6{font-size:inherit;font-weight:inherit}
	ul,ol,menu{list-style:none}
	img,svg,video{display:block;max-width:100%;height:auto}
	input,button,textarea,select{font:inherit;letter-spacing:inherit;color:inherit;background-color:transparent;appearance:none}
	[hidden]{display:none !important}
}

@layer tokens {
	:root{
		--font-size-base:1rem; --ratio:1.2;
		--step--2:calc(var(--step--1) / var(--ratio));
		--step--1:calc(var(--step-0) / var(--ratio));
		--step-0:var(--font-size-base);
		--step-1:calc(var(--step-0) * var(--ratio));
		--step-2:calc(var(--step-1) * var(--ratio));
		--font-size-bio:0.875rem;
		--line-height:1.6; --measure:65ch;
		--weight-normal:400; --weight-bold:700;
		--font-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
		--space-3xs:clamp(0.2rem,0.164rem + 0.179vw,0.25rem);
		--space-2xs:clamp(0.4rem,0.329rem + 0.357vw,0.5rem);
		--space-xs:clamp(0.6rem,0.493rem + 0.536vw,0.75rem);
		--space-s:clamp(0.8rem,0.657rem + 0.714vw,1rem);
		--space-m:clamp(1.2rem,0.986rem + 1.071vw,1.5rem);
		--space-l:clamp(1.6rem,1.314rem + 1.429vw,2rem);
		--space-xl:clamp(2.4rem,1.971rem + 2.143vw,3rem);
		--space-2xl:clamp(3.2rem,2.629rem + 2.857vw,4rem);
		--accent-hue:265; --hue:var(--accent-hue);
		--bg:light-dark(oklch(0.99 0.004 var(--accent-hue)),oklch(0.17 0.022 var(--accent-hue)));
		--surface:light-dark(oklch(0.94 0.022 var(--accent-hue)),oklch(0.22 0.022 var(--accent-hue)));
		--surface-raised:light-dark(oklch(0.88 0.022 var(--accent-hue)),oklch(0.28 0.022 var(--accent-hue)));
		--border:light-dark(oklch(0.83 0.022 var(--accent-hue)),oklch(0.33 0.022 var(--accent-hue)));
		--muted:light-dark(oklch(0.54 0.022 var(--accent-hue)),oklch(0.62 0.022 var(--accent-hue)));
		--fg:light-dark(oklch(0.27 0.0352 var(--accent-hue)),oklch(0.89 0.0352 var(--accent-hue)));
		--accent:light-dark(oklch(0.55 0.085 var(--accent-hue)),oklch(0.74 0.085 var(--accent-hue)));
		--accent-contrast:light-dark(oklch(1 0 0),oklch(0.1 0 0));
		--accent-hover:color-mix(in oklch,var(--accent),black 12%);
		--warn:light-dark(oklch(0.5 0.0725 85),oklch(0.66 0.1 85));
		--warn-surface:light-dark(oklch(0.94 0.024 85),oklch(0.22 0.0319 85));
		--warn-edge:light-dark(oklch(0.83 0.09 85),oklch(0.33 0.0478 85));
		--gold:light-dark(oklch(0.62 0.12 85),oklch(0.8 0.13 85));
		--radius-sm:0.4375rem; --radius:0.625rem; --radius-md:0.875rem;
		--radius-full:calc(infinity * 1px);
		--avatar-s:1.75rem; --avatar-m:2.5rem;
		--border-width:1px;
		--shadow:0 1px 2px oklch(0.2 0.03 var(--hue)/0.10),0 6px 20px oklch(0.2 0.03 var(--hue)/0.12);
		--transition-speed:150ms; --transition-ease:cubic-bezier(0.2,0,0.2,1);
		--app-max-width:100rem;
	}
}

@layer base {
	html{color-scheme:light dark}
	body{background-color:var(--bg);color:var(--fg);font-family:var(--font-body);
		font-size:var(--step-0);line-height:var(--line-height);
		-webkit-font-smoothing:antialiased}
	:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
}

@layer utilities {
	.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;
		overflow:hidden;clip-path:inset(50%);white-space:nowrap}
	.spinner{inline-size:1em;block-size:1em;border:2px solid var(--border);
		border-block-start-color:var(--accent);border-radius:50%;
		animation:spin 0.7s linear infinite;flex:none}
	@keyframes spin{to{transform:rotate(360deg)}}
}

@layer composition {
	.stack{display:flex;flex-direction:column;gap:var(--gap,0);align-items:var(--align,normal)}
	.row{display:flex;flex-wrap:wrap;gap:var(--gap,0);align-items:var(--align,normal)}
	.bar{display:flex;flex-wrap:nowrap;gap:var(--gap,0);align-items:var(--align,normal)}
	.reel{display:flex;flex-wrap:nowrap;gap:var(--gap,0);overflow-x:auto;align-items:var(--align,normal)}
	.grow{flex:1 1 auto;min-inline-size:0;min-block-size:0}
	.rigid{flex:0 0 auto}
	.shell{block-size:100dvh;overflow:hidden}
	.scroller{overflow-y:auto;overscroll-behavior:contain}
	.stick{position:sticky;inset-block-start:0}
	.box{padding:var(--pad,0)}
	.truncate{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
		-webkit-box-orient:vertical;-webkit-line-clamp:var(--lines,1)}
}

/* ================================================================== *
 *  ВЫДЕРЖКА из custom.css — классы, которые ПЕРЕИСПОЛЬЗУЮТСЯ.        *
 *  В проекте они уже есть. Копировать НЕ НАДО.                       *
 * ================================================================== */
.icon{inline-size:1em;block-size:1em;flex:none;min-width:1em;min-height:1em}

.section-header{display:grid;grid-template-areas:"back lead ident actions";
	grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;
	background:var(--surface);padding:var(--space-2xs);
	border-block-end:var(--border-width) solid var(--border)}
.section-header > *{padding-inline:var(--space-3xs)}
.section-header > :first-child{padding-inline-start:var(--space-2xs)}
.section-header > :last-child{padding-inline-end:var(--space-2xs)}
.header-back{grid-area:back}
.screen-title{grid-area:ident;min-width:0;padding-block:var(--space-2xs)}
.screen-title__text{font-size:var(--step-2);margin-block:0;color:var(--accent);
	min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.screen-title__sub{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-actions{grid-area:actions;display:flex;align-items:center;justify-self:end;
	flex-wrap:wrap;justify-content:flex-end;gap:var(--space-2xs)}

.icon-btn{display:inline-flex;align-items:center;justify-content:center;flex:none;
	width:2.25rem;height:2.25rem;padding:0;border-radius:var(--radius-full);
	background:none;color:var(--fg);cursor:pointer;font-size:1.25rem;
	transition:background-color var(--transition-speed) var(--transition-ease)}
.icon-btn:hover{background-color:var(--surface-raised)}

.btn{display:inline-block;padding:var(--space-2xs) var(--space-m);
	border:var(--border-width) solid transparent;border-radius:var(--radius);
	background-color:var(--accent);color:var(--accent-contrast);
	font-weight:var(--weight-bold);line-height:1.2;text-decoration:none;cursor:pointer;
	transition:background-color var(--transition-speed) var(--transition-ease)}
.btn:hover{background-color:var(--accent-hover)}
.btn--ghost{background-color:transparent;color:var(--fg);border-color:var(--border);
	font-weight:var(--weight-normal)}
.btn--ghost:hover{background-color:var(--surface-raised)}
.btn--sm{padding:var(--space-3xs) var(--space-s);font-size:var(--step--1)}

.chip{background-color:var(--surface);border:none;border-radius:var(--radius-full);
	padding:3px var(--space-s);font-size:var(--step--1);color:var(--muted);white-space:nowrap}
.badge{flex:none;font-size:var(--step--2);padding:0.1em var(--space-2xs);
	border-radius:var(--radius-full);border:var(--border-width) solid var(--border);color:var(--muted)}
.hint{color:var(--muted);font-size:var(--step--1);margin-block-start:var(--space-2xs)}
.empty{margin-block-start:var(--space-m);padding:var(--space-s);
	border:var(--border-width) dashed var(--border);border-radius:var(--radius);text-align:center}
.load-more{margin-block-start:var(--space-m);margin-inline:auto;display:block;inline-size:fit-content}
.section-label{font-size:var(--step-1);font-weight:var(--weight-bold);color:var(--muted);
	text-transform:uppercase;letter-spacing:0.06em;margin-block:0}

.ucard-shell{container:ucard / inline-size}
.ucard-list{list-style:none;padding-inline-start:0;margin-block:0}
.ucard-list--divided > * + *{border-block-start:var(--border-width) solid var(--border)}
.ucard{--ucard-avatar:var(--space-2xl);display:grid;
	grid-template-columns:auto minmax(0,1fr) auto;
	grid-template-areas:"who who actions" ". extra actions" "meta meta meta";
	column-gap:var(--space-s);row-gap:var(--space-xs)}
.ucard--row{--ucard-avatar:var(--space-xl);padding-block:var(--space-s);
	padding-inline:var(--space-2xs);border-radius:var(--radius);row-gap:var(--space-2xs)}
.ucard__who{grid-area:who;display:grid;grid-template-columns:subgrid;
	column-gap:var(--space-s);row-gap:var(--space-3xs);align-items:start;
	background:none;border:none;padding:0;font:inherit;text-align:start;inline-size:100%}
.ucard__who:is(button){cursor:pointer}
.ucard__avatar{grid-column:1;grid-row:1 / -1;align-self:start;margin:0}
.ucard__photo{inline-size:var(--ucard-avatar);block-size:var(--ucard-avatar);aspect-ratio:1;
	object-fit:cover;border-radius:var(--radius);border:var(--border-width) solid var(--border);
	background-color:var(--surface);display:grid;place-items:center;
	font-weight:var(--weight-bold);color:var(--muted)}
.ucard__name{grid-column:2;grid-row:1;align-self:center;font-weight:var(--weight-bold);
	font-size:var(--step-1);overflow-wrap:anywhere}
.ucard__bio{grid-column:2;grid-row:2;display:block;color:var(--muted);
	font-size:var(--font-size-bio);overflow-wrap:anywhere;user-select:text}
.ucard__meta{grid-area:meta}
@container ucard (max-width:26rem){
	.ucard{grid-template-columns:auto minmax(0,1fr);
		grid-template-areas:"who who" "extra extra" "meta meta" "actions actions"}
}
@container ucard (max-width:17rem){
	.ucard__who{grid-template-columns:minmax(0,1fr)}
	.ucard__avatar{grid-row:1}
	.ucard__name{grid-column:1;grid-row:2}
	.ucard__bio{grid-column:1;grid-row:3}
}

.feed-item{display:grid;grid-template-columns:minmax(0,1fr) auto;
	grid-template-areas:"meta thumb" "title thumb" "excerpt thumb" "foot thumb";
	column-gap:var(--space-s);row-gap:var(--space-3xs)}
.feed-meta{grid-area:meta}
.feed-title{grid-area:title;font-size:var(--step-1);font-weight:var(--weight-bold);
	line-height:1.3;margin-block:0}
.feed-excerpt{grid-area:excerpt;color:var(--muted);margin-block:0}
.feed-foot{grid-area:foot}
.feed-kind,.feed-time{color:var(--muted);font-size:var(--step--2)}
.feed-kind{font-weight:var(--weight-bold);letter-spacing:0.08em;text-transform:uppercase}

/* ================================================================== *
 *  НОВОЕ — вот это копировать в custom.css. Префикс .sr-.           *
 *  Всё держится на существующих токенах, новых переменных нет.       *
 * ================================================================== */

/* Полоса состояния под шапкой. Живёт только пока идёт обход: показывает,
   какой источник читается сейчас, и даёт прервать. Исчезает по готовности —
   постоянного места на экране не занимает. */
.sr-status{
	background-color:var(--surface);
	border-block-end:var(--border-width) solid var(--border);
	padding:var(--space-2xs) var(--space-s);
	font-size:var(--step--1);
	color:var(--muted);
}

/* Шапка в одну строку: подпись + разобранный запрос. Подпись не сжимается
   и не переносится, фишки уезжают в прокрутку — при семи частях запроса
   строка не разваливается и не отъедает вторую полосу высоты. */
.sr-title{min-inline-size:0}
.sr-title-label{flex:none}
.sr-title-short{display:none}

/* Разобранный запрос: одна фишка на одну часть. Это единственное место,
   где человеку показывают, что пробел = «И», а не «фраза». Дешевле
   любой подсказки текстом. */
.sr-parts{
	--gap:var(--space-2xs);--align:center;
	min-inline-size:0;
	/* Полоса прокрутки съела бы вертикальный ритм шапки — прячем её,
	   уехавшие фишки достаются жестом и колесом. */
	scrollbar-width:none;
	padding-block:var(--space-3xs);
}
.sr-parts::-webkit-scrollbar{display:none}
.sr-part{
	flex:none;
	background-color:var(--accent);
	color:var(--accent-contrast);
	border-radius:var(--radius-full);
	padding:2px var(--space-xs);
	font-size:var(--step--1);
	font-weight:var(--weight-bold);
	white-space:nowrap;
}
.sr-parts-and{flex:none;color:var(--muted);font-size:var(--step--2);text-transform:uppercase;
	letter-spacing:0.08em}

/* Перемычка групп — липкая лента с переходом к группе. Нужна потому, что
   групп до шести, а высота выдачи непредсказуема. Счётчик — «показано»,
   не «найдено»: общего числа у нас нет и не будет (SEARCH-SPEC §3.4). */
.sr-jump{
	background-color:var(--bg);
	border-block-end:var(--border-width) solid var(--border);
	padding:var(--space-2xs) var(--space-s);
	z-index:2;
}
.sr-jump-btn{
	/* flex:none — иначе .reel (flex-wrap:nowrap) сжимает кнопки, и счётчик
	   налезает на подпись. Лента должна прокручиваться, а не давить. */
	flex:none;
	display:inline-flex;align-items:center;gap:var(--space-2xs);
	background-color:var(--surface);
	border:var(--border-width) solid transparent;
	border-radius:var(--radius-full);
	padding:var(--space-3xs) var(--space-2xs) var(--space-3xs) var(--space-s);
	font-size:var(--step--1);color:var(--muted);white-space:nowrap;cursor:pointer;
	transition:background-color var(--transition-speed) var(--transition-ease),
		color var(--transition-speed) var(--transition-ease);
}
.sr-jump-btn:hover{background-color:var(--surface-raised);color:var(--fg)}
.sr-jump-btn[aria-current="true"]{background-color:var(--surface-raised);color:var(--fg);
	border-color:var(--border)}
.sr-jump-btn .icon{font-size:1.1em;flex:none}
.sr-jump-label{flex:none}
/* Счётчик — своя пилюля на фоне страницы: цифра отделена от подписи
   формой, а не только зазором, и не сливается с ней при любом числе знаков. */
.sr-jump-n{
	flex:none;
	font-variant-numeric:tabular-nums;
	font-size:var(--step--2);
	line-height:1.4;
	color:var(--muted);
	background-color:var(--bg);
	border-radius:var(--radius-full);
	padding-inline:var(--space-2xs);
	min-inline-size:1.75em;
	text-align:center;
}

/* Тело выдачи. Ограничение по --measure намеренно: результат поиска
   читают глазами построчно, растянутая на весь экран строка снипета
   читается хуже, чем в чате, где есть аватар-якорь слева. */
.sr-body{--gap:var(--space-xl);max-inline-size:var(--measure);
	margin-inline:auto;padding:var(--space-m) var(--space-s) var(--space-2xl)}

.sr-group{--gap:var(--space-s);scroll-margin-block-start:6rem}
.sr-group-head{--gap:var(--space-2xs);--align:baseline;
	padding-block-end:var(--space-2xs);
	border-block-end:var(--border-width) solid var(--border)}
.sr-group-head .icon{font-size:var(--step-1);color:var(--muted);align-self:center}
.sr-group-count{color:var(--muted);font-size:var(--step--1);font-variant-numeric:tabular-nums}

/* Строка попадания для сообщений и комментариев. Не .chat-msg: тот
   заточен под пузырь в ленте (свои/чужие, хвостик, группировка по дню),
   здесь же нужна плоская строка с указанием, ГДЕ это лежит. */
.sr-hit{
	display:grid;
	grid-template-columns:auto minmax(0,1fr);
	column-gap:var(--space-s);row-gap:var(--space-3xs);
	inline-size:100%;text-align:start;
	background:none;border:var(--border-width) solid transparent;
	border-radius:var(--radius);
	padding:var(--space-xs) var(--space-2xs);
	font:inherit;color:inherit;cursor:pointer;
	transition:background-color var(--transition-speed) var(--transition-ease);
}
.sr-hit:hover,.sr-hit:focus-visible{background-color:var(--surface)}
.sr-hit-ava{
	grid-column:1;grid-row:1 / -1;align-self:start;
	inline-size:var(--avatar-s);block-size:var(--avatar-s);
	border-radius:var(--radius-sm);border:var(--border-width) solid var(--border);
	background-color:var(--surface);
	display:grid;place-items:center;
	font-size:var(--step--1);font-weight:var(--weight-bold);color:var(--muted);
}
/* Шапка строки: кто → где → когда. Порядок не случаен: «где» важнее
   времени, потому что в глобальной выдаче одинаковые снипеты из разных
   чатов иначе неразличимы. */
.sr-hit-head{grid-column:2;--gap:var(--space-2xs);--align:baseline;font-size:var(--step--1)}
.sr-hit-who{font-weight:var(--weight-bold);color:var(--fg)}
.sr-hit-where{color:var(--muted);display:inline-flex;align-items:center;gap:var(--space-3xs)}
.sr-hit-where .icon{font-size:0.9em}
.sr-hit-time{color:var(--muted);margin-inline-start:auto;font-variant-numeric:tabular-nums;
	white-space:nowrap}
.sr-hit-text{grid-column:2;overflow-wrap:anywhere}

/* Подсветка. <mark> в проекте больше нигде не используется, поэтому
   стилизуется здесь целиком. Фон намеренно приглушённый: при трёх частях
   запроса в одной строке ярких пятен становится слишком много. */
.sr-hit mark,.feed-excerpt mark,.ucard__bio mark,.ucard__name mark,.sr-quote mark{
	background-color:color-mix(in oklch,var(--gold) 35%,transparent);
	color:inherit;
	border-radius:var(--radius-sm);
	padding-inline:0.15em;
	font-weight:var(--weight-bold);
}

/* Многоточие обрезки контекста. Снипет показывает окрестность
   совпадения, а не начало записи — иначе в длинном посте совпадение
   вообще не попадёт в видимый кусок. */
.sr-ellipsis{color:var(--muted)}

/* Цитата родителя для комментария — без неё непонятно, к чему он. */
.sr-quote{
	border-inline-start:2px solid var(--border);
	padding-inline-start:var(--space-2xs);
	color:var(--muted);font-size:var(--step--1);
	margin-block-end:var(--space-3xs);
}

/* Пустая выдача. Отдельный класс поверх .empty, потому что тут нужен не
   только текст, а разбор: что именно не сработало и что попробовать. */
.sr-nothing{max-inline-size:44ch;margin-inline:auto}
.sr-nothing-title{font-size:var(--step-1);font-weight:var(--weight-bold);margin-block-end:var(--space-2xs)}
.sr-nothing-list{--gap:var(--space-3xs);text-align:start;color:var(--muted);
	font-size:var(--step--1);margin-block-start:var(--space-s)}
.sr-nothing-list li{padding-inline-start:var(--space-s);position:relative}
.sr-nothing-list li::before{content:"→";position:absolute;inset-inline-start:0;color:var(--muted)}

/* Клавиатурная выделенная строка. Отдельно от :hover — мышь и клавиатура
   не должны спорить за одну подсветку. */
.sr-hit[data-cursor="true"],.ucard[data-cursor="true"],.feed-item[data-cursor="true"]{
	background-color:var(--surface);
	border-color:var(--accent);
	border-radius:var(--radius);
}

.sr-kbd{
	display:inline-block;font-size:var(--step--2);font-family:ui-monospace,monospace;
	border:var(--border-width) solid var(--border);border-radius:var(--radius-sm);
	padding:0 0.35em;color:var(--muted);background-color:var(--surface);
}

/* ------------------------------------------------------------------ *
 *  Адаптивность — на контейнере экрана, а не на окне.                *
 *  Меряется .sr-screen: тот же экран внутри узкой колонки складывается *
 *  так же, как на телефоне, и про размер окна ничего не знает.        *
 *  Карточки контактов и каналов адаптируются САМИ — у .ucard-shell    *
 *  свой контейнер и свои пороги, уже написанные в проекте.            *
 * ------------------------------------------------------------------ */
.sr-screen{container:srscreen / inline-size}

/* Порог 46rem — ниже него ширина строки перестаёт быть ограничением
   (--measure уже не достигается), и поля вокруг ленты становятся
   дороже самого текста. */
@container srscreen (max-width:46rem){
	.sr-body{padding-inline:var(--space-2xs);--gap:var(--space-l)}
	.sr-hit{padding-inline:var(--space-3xs)}
	.sr-group{scroll-margin-block-start:5rem}
}

/* Порог 34rem — колонка времени в шапке строки начинает драться за
   место с «где». Время уходит на свою строку под текстом: оно нужно
   для опознания, но последним. */
@container srscreen (max-width:34rem){
	.sr-hit{grid-template-areas:"ava head" "ava text" ". time";row-gap:var(--space-3xs)}
	.sr-hit-ava{grid-area:ava}
	.sr-hit-head{grid-area:head;flex-wrap:wrap}
	.sr-hit-text{grid-area:text}
	.sr-hit-time{grid-area:time;margin-inline-start:0;font-size:var(--step--2)}
	.sr-hit-where{min-inline-size:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
	.feed-item{grid-template-columns:minmax(0,1fr);
		grid-template-areas:"meta" "title" "excerpt" "foot" "thumb"}
	.feed-thumb{justify-self:start}
}

/* Порог 26rem — телефон в один столбец. Подписи групп в перемычке
   уступают место значкам: шесть подписей туда не влезают ни при какой
   вёрстке, а значок с числом опознаётся с одного взгляда. Подпись
   остаётся у текущей группы — иначе неясно, где ты. */
@container srscreen (max-width:26rem){
	.sr-title-label .sr-title-long{display:none}
	.sr-title-label .sr-title-short{display:inline}
	.sr-jump-btn{padding-inline:var(--space-2xs)}
	.sr-jump-label{
		/* Не display:none — подпись нужна вспомогательным технологиям. */
		position:absolute;inline-size:1px;block-size:1px;overflow:hidden;
		clip-path:inset(50%);white-space:nowrap;
	}
	.sr-jump-btn[aria-current="true"] .sr-jump-label{
		position:static;inline-size:auto;block-size:auto;clip-path:none;
	}
	.sr-hit-ava{display:none}
	.sr-hit{grid-template-columns:minmax(0,1fr);
		grid-template-areas:"head" "text" "time"}
	.sr-status{padding-inline:var(--space-2xs)}
	.sr-jump{padding-inline:var(--space-2xs)}
}

/* ================================================================== *
 *  Только для этого макета — обвязка демонстрации.                   *
 * ================================================================== */
.demo-bar{position:fixed;inset-block-end:var(--space-s);inset-inline:0;
	display:flex;justify-content:center;gap:var(--space-2xs);z-index:10;
	pointer-events:none;flex-wrap:wrap;padding-inline:var(--space-s)}
.demo-bar > *{pointer-events:auto}
.demo-btn{background-color:var(--surface-raised);border:var(--border-width) solid var(--border);
	border-radius:var(--radius-full);padding:var(--space-3xs) var(--space-s);
	font-size:var(--step--1);cursor:pointer;box-shadow:var(--shadow)}
.demo-btn[aria-pressed="true"]{background-color:var(--accent);color:var(--accent-contrast);

.demo-aside{inline-size:16rem;border-inline-end:var(--border-width) solid var(--border);
	background-color:var(--surface);padding:var(--space-s);--gap:var(--space-2xs)}
@media (max-width:60rem){.demo-aside{display:none}}
.file-search-field{background-color:var(--bg);border:var(--border-width) solid var(--border);
	border-radius:var(--radius-sm);padding:var(--space-2xs) var(--space-xs);color:var(--muted)}
.file-search-field input{inline-size:100%;color:var(--fg)}
.sidebar-row{margin-block-end:var(--space-s)}
/* Строка-подсказка в сайдбаре — тот самый второй путь к поиску, чтобы
   Enter не был единственным и скрытым. В проекте это часть nav-groups. */
.sr-cue{inline-size:100%;text-align:start;background:none;border:none;cursor:pointer;

	font-size:var(--step--1);display:flex;align-items:center;gap:var(--space-2xs)}
.sr-cue:hover{background-color:var(--surface-raised)}
</style>
</head>

<script>
const esc = (s) => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Подсветка + обрезка контекста вокруг ПЕРВОГО совпадения.
   В движке это отдельный проход по показанным записям (SEARCH-ALGO §11),
   здесь — упрощённая имитация. */
function snippet(text, parts, radius = 90) {
	const low = text.toLowerCase();
	let first = -1;
	for (const p of parts) {
		const i = low.indexOf(p);
		if (i >= 0 && (first < 0 || i < first)) first = i;
	}
	let start = 0, cutHead = false;
	if (first > radius) { start = first - radius; cutHead = true; }
	let slice = text.slice(start, start + radius * 3);
	const cutTail = start + radius * 3 < text.length;
	let out = esc(slice);
	for (const p of parts) {
		out = out.replace(new RegExp('(' + p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi'), '<mark>$1</mark>');
	}
	return (cutHead ? '<span class="sr-ellipsis">…</span>' : '') + out + (cutTail ? '<span class="sr-ellipsis">…</span>' : '');
}

const ICONS = {

const icon = (name, extra = '') =>
	`<svg class="icon ${extra}" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="${ICONS[name]}"/></svg>`;

const PARTS = ['работ','деньг'];

const DATA = [

function renderUcard(it) {
	return `<li class="ucard-shell"><div class="ucard ucard--row" tabindex="-1" data-hit>
		<button class="ucard__who" type="button">
			<figure class="ucard__avatar"><div class="ucard__photo">${it.ava}</div></figure>
			<span class="ucard__name">${snippet(it.name, PARTS)}</span>
			<span class="ucard__bio">${snippet(it.bio, PARTS)}</span>
		</button>
	</div></li>`;
}
function renderHit(it) {
	return `<li><button class="sr-hit" type="button" tabindex="-1" data-hit>
		<span class="sr-hit-ava">${it.ava}</span>
		<span class="sr-hit-head bar">
			<span class="sr-hit-who">${esc(it.who)}</span>
			<span class="sr-hit-where">${icon('chat')}${esc(it.where)}</span>
			<span class="sr-hit-time">${esc(it.time)}</span>
		</span>
		<span class="sr-hit-text">
			${it.quote ? `<span class="sr-quote">${esc(it.quote)}</span>` : ''}
			${snippet(it.text, PARTS)}
		</span>
	</button></li>`;
}
function renderFeed(it) {
	return `<li><div class="feed-item" tabindex="-1" data-hit style="cursor:pointer;padding:var(--space-xs) var(--space-2xs);border:var(--border-width) solid transparent">
		<span class="feed-meta bar" style="--gap:var(--space-2xs)">
			<span class="feed-kind">${esc(it.channel)}</span>
			<span class="feed-time">${esc(it.time)}</span>
		</span>
		<h3 class="feed-title">${snippet(it.title, PARTS)}</h3>
		<p class="feed-excerpt">${snippet(it.excerpt, PARTS)}</p>
	</div></li>`;
}

function renderGroup(g) {
	const rows = g.items.map(it =>
		g.kind === 'ucard' ? renderUcard(it) : g.kind === 'feed' ? renderFeed(it) : renderHit(it)
	).join('');
	return `<section class="sr-group stack" id="g-${g.id}">
		<header class="sr-group-head bar">
			${icon(g.icon)}
			<h2 class="section-label">${esc(g.label)}</h2>
			<span class="sr-group-count">показано ${g.items.length}</span>
		</header>
		<ul class="ucard-list ${g.kind === 'ucard' ? 'ucard-list--divided' : ''}">${rows}</ul>
		${g.exhausted ? '' : '<button class="btn btn--ghost btn--sm load-more" type="button">Показать ещё</button>'}
	</section>`;
}

function renderJump(groups) {
	return groups.map((g, i) =>
		`<button class="sr-jump-btn" type="button" data-jump="g-${g.id}" ${i === 0 ? 'aria-current="true"' : ''}>
			${icon(g.icon)}<span class="sr-jump-label">${esc(g.label)}</span><span class="sr-jump-n">${g.items.length}</span>
		</button>`
	).join('');
}

const body = document.getElementById('body');
const jump = document.getElementById('jump');
const status = document.getElementById('status');
const statusText = document.getElementById('status-text');

function setState(state) {
	document.querySelectorAll('.demo-btn').forEach(b =>
		b.setAttribute('aria-pressed', String(b.dataset.state === state)));

	if (state === 'empty') {
		status.hidden = true; jump.hidden = true;
		body.innerHTML = `<div class="empty sr-nothing">
			<p class="sr-nothing-title">Ничего не нашлось</p>
			<p style="color:var(--muted)">Ни одна запись не содержит сразу обе части запроса.</p>
			<ul class="sr-nothing-list stack">
				<li>Уберите одну часть — искать «работ» проще, чем «работ деньг»</li>
				<li>Укоротите корень: «работ» найдёт и «работа», и «работали»</li>
				<li>Поиск идёт по подстроке, поэтому «работа» не найдёт «рабочий»</li>
				<li>Ищется только то, что уже загружено на это устройство</li>
			</ul>
		</div>`;
		return;
	}
	if (state === 'cancelled') {
		status.hidden = true; jump.hidden = true;
		body.innerHTML = `<div class="empty sr-nothing">
			<p class="sr-nothing-title">Поиск прерван</p>
			<p style="color:var(--muted)">Показано то, что успело найтись. Полный обход не завершён.</p>
			<button class="btn load-more" type="button">Продолжить поиск</button>
		</div>`;
		return;
	}

	const running = state === 'running';
	const groups = running ? DATA.slice(0, 2) : DATA;

	status.hidden = !running;
	if (running) statusText.textContent = 'Читаю сообщения…';

	jump.hidden = false;
	jump.innerHTML = renderJump(groups) + (running
		? `<span class="sr-jump-btn" style="cursor:default"><span class="spinner"></span><span>ещё ищу</span></span>`
		: '');
	body.innerHTML = groups.map(renderGroup).join('') +
		(running ? '' : `<p class="hint" style="text-align:center">
			<span class="sr-kbd">↑</span> <span class="sr-kbd">↓</span> перемещение &nbsp;·&nbsp;
			<span class="sr-kbd">Enter</span> открыть &nbsp;·&nbsp;
			<span class="sr-kbd">Esc</span> закрыть</p>`);
	cursor = -1;
}

/* Клавиатурная навигация по выдаче — сквозная, через границы групп.
   Роль курсора отделена от :hover: мышь и клавиатура не спорят. */
let cursor = -1;
function hits() { return [...body.querySelectorAll('[data-hit]')]; }
function moveCursor(delta) {
	const list = hits();
	if (!list.length) return;
	list.forEach(el => el.removeAttribute('data-cursor'));
	cursor = (cursor + delta + list.length) % list.length;
	const el = list[cursor];
	el.setAttribute('data-cursor', 'true');
	el.scrollIntoView({ block: 'nearest' });
	el.focus({ preventScroll: true });
}
document.addEventListener('keydown', (e) => {
	if (e.target.tagName === 'INPUT') return;
	if (e.key === 'ArrowDown') { e.preventDefault(); moveCursor(1); }
	if (e.key === 'ArrowUp') { e.preventDefault(); moveCursor(-1); }
});

jump.addEventListener('click', (e) => {
	const btn = e.target.closest('[data-jump]');
	if (!btn) return;
	document.getElementById(btn.dataset.jump)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

/* Перемычка подсвечивает группу, которая сейчас в поле зрения. */
const io = new IntersectionObserver((entries) => {
	for (const en of entries) {
		if (!en.isIntersecting) continue;
		jump.querySelectorAll('[data-jump]').forEach(b =>
			b.setAttribute('aria-current', String(b.dataset.jump === en.target.id)));
	}
}, { root: document.getElementById('scroller'), rootMargin: '-20% 0px -70% 0px' });

const observeGroups = () => body.querySelectorAll('.sr-group').forEach(g => io.observe(g));

document.querySelectorAll('.demo-btn').forEach(b =>
	b.addEventListener('click', () => { setState(b.dataset.state); observeGroups(); }));

document.getElementById('cancel-btn').addEventListener('click', () => setState('cancelled'));

/* Переключатель ширины — только для макета. Меняет ширину контейнера
   экрана, чтобы пороги @container srscreen были видны без ресайза окна. */
const screenEl = document.getElementById('screen');
document.querySelectorAll('[data-w]').forEach(b => b.addEventListener('click', () => {
	document.querySelectorAll('[data-w]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
	const w = Number(b.dataset.w);
	if (w === 0) { screenEl.style.flex = '1 1 auto'; screenEl.style.maxInlineSize = 'none'; }
	else { screenEl.style.flex = '0 0 auto'; screenEl.style.maxInlineSize = w + 'rem'; screenEl.style.inlineSize = w + 'rem'; }
}));

setState('done');
observeGroups();
</script>
</body>
</html>
