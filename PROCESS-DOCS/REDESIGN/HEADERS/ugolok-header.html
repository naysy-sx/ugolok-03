<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Уголок — универсальная шапка экрана</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#17140F;
  --surface:#1F1B15;
  --surface-2:#262118;
  --lamp:#E9A23B;
  --lamp-dim:#8A6524;
  --draught:#6FB7B0;
  --ink:#F3EDE3;
  --ink-2:#B9AE9C;
  --ink-3:#7E7568;
  --line:rgba(243,237,227,.10);
  --line-2:rgba(243,237,227,.18);
  --r:10px;
  --tap:44px;
  --pad:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--night);
  color:var(--ink);
  font-family:"Golos Text",system-ui,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

/* ---------- демо-обвязка (в проект не переносится) ---------- */
.demo{max-width:860px;margin:0 auto;padding:28px 20px 64px}
.demo-bar{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-bottom:22px;font-size:13px;color:var(--ink-2)}
.demo-bar label{display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.seg button{appearance:none;background:none;border:0;color:var(--ink-2);font:inherit;font-size:13px;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
input[type=range]{accent-color:var(--lamp);width:180px}
.stage{display:flex;justify-content:center}
.device{
  width:100%;
  border:1px solid var(--line-2);
  border-radius:16px;
  overflow:hidden;
  background:var(--surface);
  transition:width .12s ease;
}

/* ---------- ЭКРАН ---------- */
.screen{display:flex;flex-direction:column;height:520px}

/* ---------- ШАПКА ---------- */
.section-header{
  container-type:inline-size;
  position:relative;
  display:grid;
  grid-template-areas:"back lead ident actions";
  grid-template-columns:auto auto minmax(0,1fr) auto;
  align-items:center;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  isolation:isolate;
}
/* подпись «вечерний угол»: свет лампы из левого верхнего угла */
.section-header::before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(120% 180% at 0% 0%, rgba(233,162,59,.13), transparent 62%);
}
.section-header > *{padding-inline:4px}
.section-header > :first-child{padding-inline-start:6px}
.section-header > :last-child{padding-inline-end:6px}

.h-back{grid-area:back}
.h-lead{grid-area:lead;display:flex;align-items:center}
.h-ident{grid-area:ident;min-width:0;padding-block:8px}
.h-actions{grid-area:actions;display:flex;align-items:center;justify-self:end;gap:2px}

.h-title{
  margin:0;font-size:16px;font-weight:500;letter-spacing:-.01em;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.h-sub{
  margin:1px 0 0;font-size:12.5px;color:var(--ink-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.h-sub .dot{color:var(--ink-3);margin:0 5px}
.h-sub .live{color:var(--draught)}

.avatar{
  width:34px;height:34px;border-radius:50%;flex:0 0 auto;
  background:var(--lamp-dim);color:#1B1206;
  display:grid;place-items:center;font-size:13px;font-weight:600;
}
.avatar.sq{border-radius:8px}

/* кнопки: видимый размер меньше, зона нажатия всегда 44 */
.btn{
  appearance:none;background:none;border:0;color:var(--ink-2);font:inherit;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:var(--tap);min-width:var(--tap);padding:0 10px;
  border-radius:var(--r);cursor:pointer;
}
.btn:hover{background:rgba(243,237,227,.06);color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--lamp);outline-offset:-3px}
.btn.icon{padding:0;width:var(--tap)}
.btn .lbl{font-size:14px}
.btn svg{width:20px;height:20px;flex:0 0 auto}

/* ---------- ПОЛОСА РАЗДЕЛОВ ---------- */
.slices{
  display:flex;gap:2px;padding:0 6px;
  background:var(--surface);border-bottom:1px solid var(--line);
}
.slice{
  appearance:none;background:none;border:0;font:inherit;color:var(--ink-2);
  min-height:42px;padding:0 12px;cursor:pointer;
  border-bottom:2px solid transparent;
}
.slice[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--lamp)}
.slice .badge{
  display:inline-block;margin-inline-start:6px;min-width:18px;padding:0 5px;
  border-radius:9px;background:var(--lamp-dim);color:#1B1206;
  font-size:11px;font-weight:600;line-height:18px;text-align:center;vertical-align:1px;
}

/* ---------- ЛЕНТА + СРЕЗ ПО ВЛОЖЕНИЯМ ---------- */
.feed{flex:1;overflow-y:auto;background:var(--night);position:relative}
.cuts{
  position:sticky;top:0;z-index:2;
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  padding:8px 10px;
  background:color-mix(in srgb, var(--night) 88%, transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.cuts::-webkit-scrollbar{display:none}
.cut{
  appearance:none;flex:0 0 auto;font:inherit;font-size:13px;
  background:none;border:1px solid var(--line-2);color:var(--ink-2);
  min-height:32px;padding:0 12px;border-radius:16px;cursor:pointer;
}
.cut:hover{border-color:var(--ink-3);color:var(--ink)}
.cut[aria-pressed="true"]{background:var(--lamp);border-color:var(--lamp);color:#1B1206;font-weight:500}
.cut.pin{position:sticky;left:0;z-index:1;background:var(--night)}
.cut.pin[aria-pressed="true"]{background:var(--lamp)}

.cut-note{
  display:none;align-items:center;gap:10px;
  padding:8px 14px;font-size:13px;color:var(--ink-2);
  border-bottom:1px solid var(--line);
}
.cut-note.on{display:flex}
.cut-note button{appearance:none;background:none;border:0;font:inherit;font-size:13px;color:var(--draught);cursor:pointer;padding:0}

.msgs{padding:14px}
.msg{display:flex;gap:10px;margin-bottom:14px}
.msg .avatar{width:28px;height:28px;font-size:11px}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;max-width:78%}
.bubble p{margin:0;font-size:14px}
.bubble .who{font-size:12px;color:var(--lamp);margin-bottom:2px}
.msg.own{flex-direction:row-reverse}
.msg.own .bubble{background:var(--surface-2);border-color:var(--line-2)}
.pane{padding:18px 16px;color:var(--ink-2);font-size:14px}
.pane h3{margin:0 0 4px;font-size:15px;font-weight:500;color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row span{color:var(--ink)}
.row em{font-style:normal;color:var(--ink-3);font-size:13px}

/* ---------- ПЕРЕКЛАДЫВАНИЕ ПРИ УЗКОМ КОНТЕЙНЕРЕ ---------- */
@container (width < 30rem){
  .section-header{
    grid-template-areas:"back lead actions" "ident ident ident";
    grid-template-columns:auto auto minmax(0,1fr);
  }
  .h-ident{padding-block:0 10px;padding-inline-start:10px}
  .h-title{white-space:normal;font-size:17px;line-height:1.25}
  .btn .lbl{display:none}
  .btn{padding:0;width:var(--tap)}
}

@media (prefers-reduced-motion:reduce){.device{transition:none}}
</style>
</head>
<body>
<div class="demo">

  <div class="demo-bar">
    <label>Ширина
      <input type="range" id="w" min="320" max="860" step="1" value="860">
      <b id="wout" style="color:var(--ink);font-weight:500;min-width:52px">860px</b>
    </label>
    <label>Экран
      <span class="seg" id="pick">
        <button data-s="chat" aria-pressed="true">Чат</button>
        <button data-s="channel" aria-pressed="false">Канал</button>
        <button data-s="settings" aria-pressed="false">Настройки</button>
      </span>
    </label>
  </div>

  <div class="stage">
    <div class="device" id="device">
      <div class="screen">

        <header class="section-header">
          <button class="btn icon h-back" aria-label="Назад">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <div class="h-lead" id="lead"><div class="avatar">АК</div></div>
          <div class="h-ident">
            <h1 class="h-title" id="title">Алексей Коновалов</h1>
            <p class="h-sub" id="sub"><span class="live">в сети</span></p>
          </div>
          <div class="h-actions" id="actions"></div>
        </header>

        <nav class="slices" id="slices" aria-label="Разделы" hidden></nav>

        <div class="feed" id="feed"></div>

      </div>
    </div>
  </div>
</div>

<script>
const ICON = {
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/>',
  dots:'<circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1v.3a2 2 0 11-4 0v-.2a1.6 1.6 0 00-2.7-1.1l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.6 1.6 0 004 15a2 2 0 01-2-2 2 2 0 012-2 1.6 1.6 0 001.1-2.7l-.1-.1a2 2 0 112.8-2.8l.1.1A1.6 1.6 0 0010 4.6a2 2 0 014 0 1.6 1.6 0 002.7 1.1l.1-.1a2 2 0 112.8 2.8l-.1.1A1.6 1.6 0 0020 11a2 2 0 010 4z"/>',
  pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>'
};
const svg = k => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+ICON[k]+'</svg>';
const btn = (k,label,aria) =>
  '<button class="btn'+(label?'':' icon')+'" aria-label="'+(aria||label)+'">'+svg(k)+(label?'<span class="lbl">'+label+'</span>':'')+'</button>';

const CUTS = ['Все','Изображения','Видео','Голосовые','Документы','Архивы'];
const COUNT = {'Изображения':42,'Видео':8,'Голосовые':17,'Документы':23,'Архивы':3};

function cutsHTML(){
  return '<div class="cuts" role="group" aria-label="Показать вложения">'+
    CUTS.map((c,i)=>'<button class="cut'+(i?'':' pin')+'" aria-pressed="'+(i?'false':'true')+'">'+c+'</button>').join('')+
  '</div><div class="cut-note" id="note"></div>';
}
const MSGS = `<div class="msgs">
  <div class="msg"><div class="avatar">АК</div><div class="bubble"><p>Посмотрел спецификацию — по срезам всё сходится.</p></div></div>
  <div class="msg own"><div class="bubble"><p>Отлично. Перенёс фильтры из шапки в ленту, стало легче.</p></div></div>
  <div class="msg"><div class="avatar">АК</div><div class="bubble"><p>Шапка теперь одинаковая везде?</p></div></div>
  <div class="msg own"><div class="bubble"><p>Один компонент, меняется только содержимое зон.</p></div></div>
</div>`;

const SCREENS = {
  chat:{
    lead:'<div class="avatar">АК</div>',
    title:'Алексей Коновалов',
    sub:'<span class="live">в сети</span>',
    actions:btn('phone',null,'Позвонить')+btn('dots',null,'Ещё'),
    slices:null,
    feed:cutsHTML()+MSGS
  },
  channel:{
    lead:'<div class="avatar sq">У</div>',
    title:'Уголок: разработка и планы',
    sub:'Канал<span class="dot">·</span>1 240 подписчиков',
    actions:btn('pen','Написать','Написать запись')+btn('gear',null,'Управление каналом'),
    slices:'<button class="slice" aria-selected="true">Посты</button><button class="slice" aria-selected="false">Чат<span class="badge">3</span></button>',
    feed:cutsHTML()+MSGS
  },
  settings:{
    lead:'',
    title:'Настройки',
    sub:'Наташа<span class="dot">·</span>устройство «Рабочий ноутбук»',
    actions:'',
    slices:null,
    feed:`<div class="pane"><h3>Хранение</h3>
      <div class="row"><span>Кэш вложений</span><em>412 МБ</em></div>
      <div class="row"><span>Срок хранения</span><em>30 дней</em></div>
      <div class="row"><span>Автозагрузка по сети</span><em>только Wi-Fi</em></div>
      <div class="row"><span>Реле</span><em>3 подключено</em></div>
    </div>`
  }
};

const $ = s => document.querySelector(s);

function render(name){
  const s = SCREENS[name];
  $('#lead').innerHTML = s.lead;
  $('#lead').style.display = s.lead ? 'flex' : 'none';
  $('#title').textContent = s.title;
  $('#sub').innerHTML = s.sub;
  $('#sub').style.display = s.sub ? '' : 'none';
  $('#actions').innerHTML = s.actions;
  const nav = $('#slices');
  nav.hidden = !s.slices;
  nav.innerHTML = s.slices || '';
  $('#feed').innerHTML = s.feed;
  wire();
}

function wire(){
  document.querySelectorAll('.slice').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.slice').forEach(x=>x.setAttribute('aria-selected','false'));
    b.setAttribute('aria-selected','true');
  }));
  const note = $('#note');
  document.querySelectorAll('.cut').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.cut').forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
    const v = b.textContent.trim();
    if(v === 'Все'){ note.className='cut-note'; note.innerHTML=''; return; }
    note.className='cut-note on';
    note.innerHTML = v+'<span style="color:var(--ink-3)">·</span>'+COUNT[v]+
      '<button type="button" id="reset">Показать все</button>';
    $('#reset').addEventListener('click',()=>{
      document.querySelector('.cut.pin').click();
      document.querySelector('.cuts').scrollTo({left:0,behavior:'smooth'});
    });
  }));
}

$('#w').addEventListener('input',e=>{
  const v = Math.round(+e.target.value);
  $('#device').style.width = v+'px';
  $('#wout').textContent = v+'px';
});

$('#pick').addEventListener('click',e=>{
  const b = e.target.closest('button'); if(!b) return;
  $('#pick').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true');
  render(b.dataset.s);
});

render('chat');
</script>
</body>
</html>
