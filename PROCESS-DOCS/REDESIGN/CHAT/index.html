<!doctype html>
<html lang="ru" data-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Уголок — три варианта чата с вложениями</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap&subset=cyrillic,latin"
            rel="stylesheet"
        />
        <style>
            :root,
            [data-theme="dark"] {
                --bg: #17120d;
                --surface: #211a12;
                --surface-2: #2b2218;
                --sunk: #120d08;
                --text: #f0e7d6;
                --muted: #a99a82;
                --border: #34291c;
                --lamp: #e9b45e;
                --lamp-ink: #241b10;
                --lamp-glow: rgba(233, 180, 94, 0.13);
                --draught: #74c6b2;
                --draught-ink: #10221d;
                --danger: #e0876a;
                --ok: #8fbf7a;
                --sh1: 0 1px 2px rgba(0, 0, 0, 0.35);
                --sh2: 0 10px 28px rgba(0, 0, 0, 0.38);
                --r: 1.125rem;
                --rtail: 0.2rem;
                --media-w: min(100%, 20.5rem);
            }
            [data-theme="light"] {
                --bg: #f1e7d4;
                --surface: #fbf5ea;
                --surface-2: #fff;
                --sunk: #e9dec9;
                --text: #33291d;
                --muted: #7c6e58;
                --border: #e2d4bc;
                --lamp: #e4a63f;
                --lamp-ink: #2a1e0c;
                --lamp-glow: rgba(228, 166, 63, 0.16);
                --draught: #2e9e86;
                --draught-ink: #fff;
                --danger: #c25e3e;
                --ok: #3d7a3a;
                --sh1: 0 1px 2px rgba(58, 42, 24, 0.07);
                --sh2: 0 10px 28px rgba(58, 42, 24, 0.08);
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                background: var(--bg);
                color: var(--text);
                font:
                    16px/1.45 "Golos Text",
                    system-ui,
                    sans-serif;
            }
            button,
            input,
            textarea {
                font: inherit;
                color: inherit;
            }
            button {
                cursor: pointer;
            }
            img,
            video {
                max-width: 100%;
                display: block;
            }

            .app-shell {
                min-height: 100vh;
                display: grid;
                grid-template-rows: auto auto 1fr;
            }
            .topbar {
                display: flex;
                flex-wrap: wrap;
                gap: 0.75rem 1rem;
                align-items: center;
                padding: 0.85rem 1.1rem;
                background: color-mix(
                    in oklab,
                    var(--surface) 88%,
                    transparent
                );
                border-bottom: 1px solid var(--border);
                position: sticky;
                top: 0;
                z-index: 20;
                backdrop-filter: blur(12px);
            }
            .brand {
                font-family: Unbounded, sans-serif;
                font-size: 0.92rem;
                letter-spacing: 0.02em;
            }
            .brand small {
                display: block;
                color: var(--muted);
                font-family: "Golos Text", sans-serif;
                font-weight: 400;
                letter-spacing: 0;
                margin-top: 0.15rem;
            }
            .variant-switch {
                display: flex;
                gap: 0.35rem;
                flex-wrap: wrap;
            }
            .variant-switch button,
            .theme-btn {
                border: 1px solid var(--border);
                background: var(--sunk);
                color: var(--muted);
                border-radius: 999px;
                padding: 0.35rem 0.8rem;
                font-size: 0.86rem;
            }
            .variant-switch button.is-on {
                background: var(--lamp);
                color: var(--lamp-ink);
                border-color: transparent;
                font-weight: 600;
            }
            .theme-btn {
                margin-left: auto;
            }
            .notes {
                padding: 0.7rem 1.1rem;
                color: var(--muted);
                font-size: 0.86rem;
                border-bottom: 1px solid var(--border);
                background: var(--sunk);
            }
            .notes strong {
                color: var(--text);
                font-weight: 600;
            }

            .stage {
                display: grid;
                place-items: start center;
                padding: 1.2rem 1rem 3rem;
            }
            .phone {
                width: min(100%, 420px);
                height: min(86vh, 860px);
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 22px;
                box-shadow: var(--sh2);
                display: grid;
                grid-template-rows: auto 1fr auto;
                overflow: hidden;
                position: relative;
            }
            .phone.wide {
                width: min(100%, 920px);
                grid-template-columns: 1fr 280px;
                grid-template-rows: auto 1fr auto;
            }
            .phone.wide .chat-head,
            .phone.wide .composer {
                grid-column: 1 / -1;
            }
            .phone.wide .thread {
                grid-column: 1;
            }
            .phone.wide .media-rail {
                grid-column: 2;
                grid-row: 2;
                border-left: 1px solid var(--border);
            }

            .chat-head {
                display: flex;
                align-items: center;
                gap: 0.7rem;
                padding: 0.7rem 0.85rem;
                border-bottom: 1px solid var(--border);
                background: color-mix(
                    in oklab,
                    var(--surface-2) 70%,
                    transparent
                );
            }
            .back {
                width: 34px;
                height: 34px;
                border-radius: 10px;
                border: 0;
                background: transparent;
                color: var(--text);
                font-size: 1.15rem;
            }
            .avatar {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: linear-gradient(135deg, #6b4a28, var(--lamp));
                display: grid;
                place-items: center;
                font-weight: 700;
                color: var(--lamp-ink);
                flex: none;
            }
            .who {
                flex: 1;
                min-width: 0;
            }
            .who b {
                display: block;
                font-size: 0.95rem;
            }
            .who span {
                color: var(--muted);
                font-size: 0.75rem;
            }
            .head-actions {
                display: flex;
                gap: 0.3rem;
            }
            .iconish {
                width: 34px;
                height: 34px;
                border: 0;
                border-radius: 10px;
                background: transparent;
                color: var(--text);
                display: grid;
                place-items: center;
            }
            .iconish:hover {
                background: var(--sunk);
            }

            .thread {
                overflow: auto;
                padding: 0.85rem 0.75rem 1rem;
                background-image: radial-gradient(
                    120% 55% at 100% 0%,
                    var(--lamp-glow),
                    transparent 60%
                );
                display: flex;
                flex-direction: column;
                gap: 0.45rem;
            }
            .day {
                align-self: center;
                font-size: 0.72rem;
                color: var(--muted);
                background: color-mix(in oklab, var(--sunk) 80%, transparent);
                border: 1px solid var(--border);
                border-radius: 999px;
                padding: 0.15rem 0.55rem;
                margin: 0.35rem 0;
            }
            .row {
                display: flex;
            }
            .row.own {
                justify-content: flex-end;
            }
            .row.other {
                justify-content: flex-start;
            }

            .bubble {
                max-width: min(78%, 22.5rem);
                border-radius: var(--r) var(--r) var(--r) var(--rtail);
                padding: 0.45rem 0.55rem 0.35rem;
                box-shadow: var(--sh1);
                min-width: 0;
            }
            .row.own .bubble {
                background: linear-gradient(
                    to bottom,
                    color-mix(in oklab, var(--lamp) 92%, white),
                    var(--lamp)
                );
                color: var(--lamp-ink);
                border-radius: var(--r) var(--r) var(--rtail) var(--r);
            }
            .row.other .bubble {
                background: var(--surface-2);
                border: 1px solid var(--border);
                color: var(--text);
            }
            .bubble.media-flush {
                padding: 0.28rem;
            }
            .bubble.media-flush .caption {
                padding: 0.35rem 0.4rem 0.15rem;
            }
            .bubble p {
                margin: 0.15rem 0.2rem 0.3rem;
                font-size: 0.93rem;
            }
            .meta {
                display: flex;
                justify-content: flex-end;
                gap: 0.4rem;
                align-items: center;
                font-size: 0.68rem;
                opacity: 0.72;
                padding: 0.05rem 0.2rem 0.1rem;
            }
            .row.own .meta {
                color: var(--lamp-ink);
            }
            .dots {
                border: 0;
                background: transparent;
                color: inherit;
                opacity: 0.7;
                padding: 0 0.15rem;
                font-size: 0.9rem;
            }

            /* Media layouts */
            .media {
                width: var(--media-w);
                max-width: 100%;
                overflow: hidden;
            }
            .tile {
                position: relative;
                overflow: hidden;
                background: #1a140e;
                display: block;
                width: 100%;
                height: 100%;
            }
            .tile img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .play {
                position: absolute;
                inset: 0;
                display: grid;
                place-items: center;
                background: linear-gradient(
                    to top,
                    rgba(0, 0, 0, 0.45),
                    rgba(0, 0, 0, 0.08)
                );
            }
            .play i {
                width: 42px;
                height: 42px;
                border-radius: 50%;
                background: color-mix(in oklab, var(--lamp) 88%, white);
                color: var(--lamp-ink);
                display: grid;
                place-items: center;
                font-style: normal;
                font-weight: 700;
                box-shadow: var(--sh1);
            }
            .vmeta {
                position: absolute;
                left: 0.4rem;
                bottom: 0.35rem;
                font-size: 0.68rem;
                color: #fff;
                text-shadow: 0 1px 3px #000;
                display: flex;
                gap: 0.35rem;
            }
            .more-badge {
                position: absolute;
                inset: 0;
                display: grid;
                place-items: center;
                background: rgba(18, 13, 8, 0.48);
                color: #fff;
                font-weight: 700;
                font-size: 1.15rem;
            }

            .lay-single .tile {
                aspect-ratio: 16/10;
                border-radius: 0.85rem;
            }
            .lay-duo {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 3px;
                border-radius: 0.85rem;
                overflow: hidden;
            }
            .lay-duo .tile {
                aspect-ratio: 1 / 1.05;
            }
            .lay-trio {
                display: grid;
                grid-template-columns: 1.2fr 0.8fr;
                grid-template-rows: 1fr 1fr;
                gap: 3px;
                height: 13.2rem;
                border-radius: 0.85rem;
                overflow: hidden;
            }
            .lay-trio .tile:first-child {
                grid-row: 1 / -1;
            }
            .lay-quad {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 3px;
                border-radius: 0.85rem;
                overflow: hidden;
            }
            .lay-quad .tile {
                aspect-ratio: 1;
            }
            .lay-hero {
                display: grid;
                gap: 3px;
                border-radius: 0.85rem;
                overflow: hidden;
            }
            .lay-hero .hero {
                aspect-ratio: 16/10;
            }
            .lay-hero .strip {
                display: grid;
                grid-auto-flow: column;
                grid-auto-columns: 1fr;
                gap: 3px;
                height: 4.4rem;
            }
            .lay-stack .tile {
                aspect-ratio: 16/10;
                border-radius: 0.7rem;
                margin-bottom: 3px;
            }
            .lay-magazine {
                display: grid;
                grid-template-columns: 1.4fr 1fr;
                gap: 3px;
                height: 14.5rem;
                border-radius: 0.85rem;
                overflow: hidden;
            }
            .lay-magazine .side {
                display: grid;
                gap: 3px;
            }

            .files {
                display: grid;
                gap: 0.28rem;
                margin: 0.35rem 0.1rem 0.15rem;
            }
            .filechip,
            .audiochip {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                background: color-mix(in oklab, var(--sunk) 55%, transparent);
                border: 1px solid
                    color-mix(in oklab, var(--border) 70%, transparent);
                border-radius: 0.7rem;
                padding: 0.38rem 0.5rem;
                text-align: left;
            }
            .row.own .filechip,
            .row.own .audiochip {
                background: color-mix(
                    in oklab,
                    var(--lamp-ink) 14%,
                    transparent
                );
                border-color: color-mix(
                    in oklab,
                    var(--lamp-ink) 18%,
                    transparent
                );
            }
            .f-ico {
                width: 28px;
                height: 28px;
                border-radius: 0.45rem;
                display: grid;
                place-items: center;
                background: var(--sunk);
                flex: none;
                font-size: 0.95rem;
            }
            .row.own .f-ico {
                background: color-mix(
                    in oklab,
                    var(--lamp-ink) 16%,
                    transparent
                );
            }
            .filechip b,
            .audiochip b {
                display: block;
                font-size: 0.78rem;
                font-weight: 600;
            }
            .filechip small,
            .audiochip small {
                color: inherit;
                opacity: 0.7;
                font-size: 0.68rem;
            }
            .wave {
                display: flex;
                align-items: end;
                gap: 2px;
                height: 18px;
                flex: 1;
            }
            .wave i {
                width: 2px;
                background: currentColor;
                opacity: 0.55;
                border-radius: 1px;
                display: block;
            }

            .composer {
                border-top: 1px solid var(--border);
                background: var(--surface);
                padding: 0.55rem 0.6rem 0.7rem;
                display: grid;
                gap: 0.4rem;
            }
            .tray {
                display: flex;
                gap: 0.4rem;
                overflow-x: auto;
                padding-bottom: 0.15rem;
            }
            .thumb {
                position: relative;
                width: 52px;
                height: 52px;
                border-radius: 0.65rem;
                overflow: hidden;
                flex: none;
                background: var(--sunk);
                border: 1px solid var(--border);
            }
            .thumb img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .thumb .x {
                position: absolute;
                top: 2px;
                right: 2px;
                width: 16px;
                height: 16px;
                border: 0;
                border-radius: 50%;
                background: rgba(18, 13, 8, 0.75);
                color: #fff;
                font-size: 0.65rem;
                line-height: 1;
            }
            .thumb.file {
                display: grid;
                place-items: center;
                font-size: 0.75rem;
                text-align: center;
                padding: 0.2rem;
                color: var(--muted);
            }
            .layouts {
                display: flex;
                gap: 0.3rem;
                flex-wrap: wrap;
            }
            .layouts button {
                border: 1px solid var(--border);
                background: var(--sunk);
                color: var(--muted);
                border-radius: 0.55rem;
                padding: 0.22rem 0.45rem;
                font-size: 0.72rem;
                display: flex;
                align-items: center;
                gap: 0.3rem;
            }
            .layouts button.is-on {
                border-color: var(--lamp);
                color: var(--lamp);
                background: var(--lamp-glow);
            }
            .mini-grid {
                width: 16px;
                height: 12px;
                display: grid;
                gap: 1px;
            }
            .mini-grid span {
                background: currentColor;
                border-radius: 1px;
            }

            .compose-row {
                display: flex;
                align-items: flex-end;
                gap: 0.35rem;
            }
            .compose-row textarea {
                flex: 1;
                resize: none;
                min-height: 42px;
                max-height: 120px;
                border-radius: 1.1rem;
                border: 1px solid var(--border);
                background: var(--sunk);
                padding: 0.55rem 0.75rem;
                outline: none;
            }
            .tool,
            .send {
                width: 40px;
                height: 40px;
                border-radius: 50%;
                border: 0;
                display: grid;
                place-items: center;
                flex: none;
            }
            .tool {
                background: var(--sunk);
                color: var(--text);
            }
            .send {
                background: var(--lamp);
                color: var(--lamp-ink);
            }

            .media-rail {
                background: var(--sunk);
                padding: 0.7rem;
                overflow: auto;
            }
            .media-rail h3 {
                font-size: 0.72rem;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                color: var(--muted);
                margin: 0 0 0.55rem;
                font-weight: 600;
            }
            .rail-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 4px;
            }
            .rail-grid img {
                aspect-ratio: 1;
                object-fit: cover;
                border-radius: 0.45rem;
                width: 100%;
                height: 100%;
            }

            .hint {
                font-size: 0.7rem;
                color: var(--muted);
                padding: 0 0.15rem;
            }

            /* Variant B specifics */
            .vB .bubble.media-flush {
                max-width: min(82%, 23rem);
            }
            .vB .group-tight {
                margin-top: -0.18rem;
            }
            .vB .row.own.group-tight .bubble {
                border-top-right-radius: 0.55rem;
            }
            .vB .row.other.group-tight .bubble {
                border-top-left-radius: 0.55rem;
            }
            .composer.pill {
                background: transparent;
                border: 0;
                padding: 0.45rem 0.55rem 0.65rem;
            }
            .composer.pill .compose-row {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 1.4rem;
                padding: 0.28rem 0.3rem 0.28rem 0.35rem;
                box-shadow: var(--sh1);
            }
            .composer.pill textarea {
                border: 0;
                background: transparent;
                min-height: 36px;
            }

            /* Variant C */
            .vC .bubble {
                max-width: min(70%, 26rem);
            }
            .vC .media {
                --media-w: min(100%, 24rem);
            }
            .collage-label {
                font-size: 0.68rem;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                opacity: 0.65;
                padding: 0.1rem 0.25rem 0.25rem;
            }

            @media (max-width: 640px) {
                .phone.wide {
                    width: min(100%, 420px);
                    grid-template-columns: 1fr;
                }
                .phone.wide .media-rail {
                    display: none;
                }
                .bubble {
                    max-width: min(88%, 22rem);
                }
            }
        </style>
    </head>
    <body>
        <div class="app-shell">
            <header class="topbar">
                <div class="brand">
                    Уголок · чат с контактом<small
                        >три макета бабблов и экрана</small
                    >
                </div>
                <nav class="variant-switch" aria-label="Варианты">
                    <button type="button" class="is-on" data-v="A">
                        A · Альбом
                    </button>
                    <button type="button" data-v="B">B · Карточка</button>
                    <button type="button" data-v="C">C · Сцена</button>
                </nav>
                <button type="button" class="theme-btn" id="themeBtn">
                    Светлая
                </button>
            </header>
            <div class="notes" id="notes"></div>
            <main class="stage">
                <section class="phone" id="phone"></section>
            </main>
        </div>

        <script>
            const P = {
                lake: "https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=800&q=70&auto=format",
                forest: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&q=70&auto=format",
                cabin: "https://images.unsplash.com/photo-1449155997615-2f2566b16ced?w=800&q=70&auto=format",
                fire: "https://images.unsplash.com/photo-1523987355523-c7b5b0dd90a7?w=800&q=70&auto=format",
                tea: "https://images.unsplash.com/photo-1515823064-d6e52627d313?w=800&q=70&auto=format",
                map: "https://images.unsplash.com/photo-1524661132064-ba1964c68742?w=800&q=70&auto=format",
                night: "https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?w=800&q=70&auto=format",
            };

            const NOTES = {
                A: "<strong>Вариант A — Альбом.</strong> Эволюция текущего экрана: те же пузыри и композер, но вложения больше не стопкой. Медиа собирается в мозаику (1 / 2 / 3 / 4+), видео сразу с постером и кнопкой Play, файлы — компактные чипы. «Скачать … огромным именем» убрано в меню ⋯. Ширина медиа жёстко ограничена (~20.5rem). В композере после 2+ файлов появляется выбор раскладки.",
                B: "<strong>Вариант B — Карточка.</strong> Медиа прижато к краям пузыря, текст читается как подпись. Сообщения группируются, даты — пилюли. Композер — «пилюля», тулбар не орёт. Герой+лента для смешанных пакетов. На телефоне пузырь чуть шире, но само медиа не растягивается на весь ноутбук.",
                C: "<strong>Вариант C — Сцена.</strong> Для планшета/десктопа: лента + рельс «в этом чате». Раскладки более редакционные (magazine / hero). У коллажа есть имя раскладки — то, что отправитель выбрал перед отправкой. На узком экране рельс прячется.",
            };

            function ico(d) {
                return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">${d}</svg>`;
            }
            const I = {
                back: ico('<path d="M15 6 9 12l6 6"/>'),
                phone: ico(
                    '<path d="M6.5 4.5 9 8l-1.8 1.8a12 12 0 0 0 7 7L16 15l3.5 2.5v3A2 2 0 0 1 18 23 17 17 0 0 1 1 6a2 2 0 0 1 2.5-1.5Z"/>',
                ),
                more: ico(
                    '<circle cx="12" cy="6" r=".9" fill="currentColor"/><circle cx="12" cy="12" r=".9" fill="currentColor"/><circle cx="12" cy="18" r=".9" fill="currentColor"/>',
                ),
                clip: ico(
                    '<path d="M21 12.5 12.5 21a6 6 0 0 1-8.5-8.5L13 3.5a4 4 0 0 1 5.7 5.7L9.8 18"/>',
                ),
                mic: ico(
                    '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4"/>',
                ),
                send: ico('<path d="M4 12 20 4l-8 16-1-7Z"/>'),
            };

            function playOverlay(label = "0:24") {
                return `<span class="play"><i>▶</i></span><span class="vmeta"><span>▶ видео</span><span>${label}</span></span>`;
            }
            function fileChip(name, size, kind = "📄") {
                return `<button class="filechip" type="button"><span class="f-ico">${kind}</span><span><b>${name}</b><small>${size}</small></span></button>`;
            }
            function audioChip(name, size) {
                const bars = [
                    8, 14, 20, 11, 17, 9, 16, 22, 12, 18, 7, 15, 21, 10, 14, 19,
                    8, 13,
                ]
                    .map((h) => `<i style="height:${h}px"></i>`)
                    .join("");
                return `<button class="audiochip" type="button"><span class="f-ico">♪</span><span class="wave">${bars}</span><span><b>${name}</b><small>${size}</small></span></button>`;
            }

            function mosaic(kind, items) {
                if (kind === "single") {
                    const it = items[0];
                    return `<div class="media lay-single"><div class="tile">${it.media}${it.video ? playOverlay(it.dur) : ""}</div></div>`;
                }
                if (kind === "duo") {
                    return `<div class="media lay-duo">${items
                        .slice(0, 2)
                        .map(
                            (it) =>
                                `<div class="tile">${it.media}${it.video ? playOverlay(it.dur) : ""}</div>`,
                        )
                        .join("")}</div>`;
                }
                if (kind === "trio") {
                    return `<div class="media lay-trio">${items
                        .slice(0, 3)
                        .map(
                            (it) =>
                                `<div class="tile">${it.media}${it.video ? playOverlay(it.dur) : ""}</div>`,
                        )
                        .join("")}</div>`;
                }
                if (kind === "quad") {
                    const extra = items.length - 4;
                    return `<div class="media lay-quad">${items
                        .slice(0, 4)
                        .map(
                            (it, i) =>
                                `<div class="tile">${it.media}${it.video ? playOverlay(it.dur) : ""}${i === 3 && extra > 0 ? `<span class="more-badge">+${extra}</span>` : ""}</div>`,
                        )
                        .join("")}</div>`;
                }
                if (kind === "hero") {
                    const [h, ...rest] = items;
                    return `<div class="media lay-hero"><div class="tile hero">${h.media}${h.video ? playOverlay(h.dur) : ""}</div><div class="strip">${rest
                        .slice(0, 4)
                        .map(
                            (it) =>
                                `<div class="tile">${it.media}${it.video ? playOverlay(it.dur) : ""}</div>`,
                        )
                        .join("")}</div></div>`;
                }
                if (kind === "magazine") {
                    const [a, b, c] = items;
                    return `<div class="media lay-magazine"><div class="tile">${a.media}${a.video ? playOverlay(a.dur) : ""}</div><div class="side"><div class="tile">${b.media}${b.video ? playOverlay(b.dur) : ""}</div><div class="tile">${c.media}${c.video ? playOverlay(c.dur) : ""}</div></div></div>`;
                }
                return `<div class="media lay-stack">${items.map((it) => `<div class="tile">${it.media}${it.video ? playOverlay(it.dur) : ""}</div>`).join("")}</div>`;
            }

            const img = (src) => `<img src="${src}" alt="" />`;

            function bubble({
                own,
                text,
                time,
                status,
                mediaHtml,
                filesHtml,
                flush,
                label,
            }) {
                return `
        <div class="row ${own ? "own" : "other"}">
          <div class="bubble ${flush ? "media-flush" : ""}">
            ${label ? `<div class="collage-label">${label}</div>` : ""}
            ${mediaHtml || ""}
            ${text ? `<p class="caption">${text}</p>` : ""}
            ${filesHtml || ""}
            <div class="meta"><span>${time}${status ? " · " + status : ""}</span><button class="dots" type="button" title="Действия">⋯</button></div>
          </div>
        </div>`;
            }

            function layoutsBar(active) {
                const items = [
                    ["duo", "2"],
                    ["trio", "3"],
                    ["quad", "4"],
                    ["hero", "герой"],
                    ["stack", "столбик"],
                ];
                return `<div class="layouts" role="group" aria-label="Раскладка вложений">${items
                    .map(
                        ([
                            id,
                            name,
                        ]) => `<button type="button" class="${id === active ? "is-on" : ""}" data-lay="${id}">
          <span class="mini-grid" aria-hidden="true"><span></span><span></span><span></span><span></span></span>${name}
        </button>`,
                    )
                    .join("")}</div>`;
            }

            function composer(variant) {
                const tray = `
        <div class="tray" aria-label="Выбранные вложения">
          <div class="thumb"><img src="${P.lake}" alt=""><button class="x" type="button">×</button></div>
          <div class="thumb"><img src="${P.forest}" alt=""><button class="x" type="button">×</button></div>
          <div class="thumb"><img src="${P.night}" alt=""><span class="play" style="background:rgba(0,0,0,.35)"><i style="width:18px;height:18px;font-size:.55rem">▶</i></span><button class="x" type="button">×</button></div>
          <div class="thumb file">PDF<br>смета<button class="x" type="button">×</button></div>
        </div>
        ${layoutsBar(variant === "C" ? "hero" : variant === "B" ? "trio" : "quad")}
        <div class="hint">Раскладка пишется в сообщение и повторяется в баббле у обоих.</div>`;
                if (variant === "B") {
                    return `<footer class="composer pill">${tray}
          <div class="compose-row">
            <button class="tool" type="button" title="Вложение">${I.clip}</button>
            <textarea rows="1" placeholder="Сообщение">три кадра с тропы и смета</textarea>
            <button class="tool" type="button" title="Голос">${I.mic}</button>
            <button class="send" type="button" title="Отправить">${I.send}</button>
          </div>
        </footer>`;
                }
                return `<footer class="composer">${tray}
        <div class="compose-row">
          <button class="tool" type="button" title="Вложение">${I.clip}</button>
          <button class="tool" type="button" title="Голос">${I.mic}</button>
          <textarea rows="1" placeholder="Написать…">${variant === "C" ? "смотри коллаж — герой сверху" : "отправить пачкой"}</textarea>
          <button class="send" type="button" title="Отправить">${I.send}</button>
        </div>
      </footer>`;
            }

            function head() {
                return `<header class="chat-head">
        <button class="back" type="button">${I.back}</button>
        <div class="avatar">АН</div>
        <div class="who"><b>Анна Нестерова</b><span>в сети · Уголок</span></div>
        <div class="head-actions">
          <button class="iconish" type="button" title="Позвонить">${I.phone}</button>
          <button class="iconish" type="button" title="Ещё">${I.more}</button>
        </div>
      </header>`;
            }

            function viewA() {
                return `${head()}
        <div class="thread">
          <div class="day">сегодня</div>
          ${bubble({ own: false, text: "Доехала. Скинь то, что снял у избы — и смету, если уже есть.", time: "10:12" })}
          ${bubble({
              own: true,
              time: "10:14",
              status: "прочитано",
              text: "пачка с тропы",
              mediaHtml: mosaic("quad", [
                  { media: img(P.lake) },
                  { media: img(P.forest) },
                  { media: img(P.cabin) },
                  { media: img(P.night), video: true, dur: "0:18" },
              ]),
              filesHtml: `<div class="files">${fileChip("smeta-izba.pdf", "240 КБ", "📄")}${audioChip("шум реки", "1.1 МБ")}</div>`,
          })}
          ${bubble({
              own: false,
              time: "10:16",
              mediaHtml: mosaic("duo", [
                  { media: img(P.tea) },
                  { media: img(P.fire) },
              ]),
              text: "у нас чай уже стоит. второе — просто костёр вечером",
          })}
          ${bubble({
              own: true,
              time: "10:17",
              status: "доставлено",
              mediaHtml: mosaic("single", [
                  { media: img(P.map), video: true, dur: "0:41" },
              ]),
              text: "короткий обход по карте — сразу превью, без кнопки-строки",
          })}
        </div>
        ${composer("A")}`;
            }

            function viewB() {
                return `${head()}
        <div class="thread vB">
          <div class="day">сегодня</div>
          ${bubble({ own: false, text: "Доехала. Скинь то, что снял у избы.", time: "10:12" })}
          <div class="row own"><div class="bubble media-flush">
            ${mosaic("hero", [{ media: img(P.lake), video: true, dur: "0:18" }, { media: img(P.forest) }, { media: img(P.cabin) }, { media: img(P.fire) }])}
            <p class="caption">четыре кадра, первый — видео с постером</p>
            <div class="files">${fileChip("smeta-izba.pdf", "240 КБ")}</div>
            <div class="meta"><span>10:14 · прочитано</span><button class="dots" type="button">⋯</button></div>
          </div></div>
          <div class="row other group-tight"><div class="bubble media-flush">
            ${mosaic("trio", [{ media: img(P.tea) }, { media: img(P.night), video: true, dur: "0:09" }, { media: img(P.map) }])}
            <div class="meta"><span>10:16</span><button class="dots" type="button">⋯</button></div>
          </div></div>
          <div class="row other"><div class="bubble"><p>второе без подписи — просто сетка</p><div class="meta"><span>10:16</span></div></div></div>
          ${bubble({ own: true, time: "10:18", status: "отправл.", filesHtml: `<div class="files">${audioChip("голосовое", "28 КБ")}</div>` })}
        </div>
        ${composer("B")}`;
            }

            function viewC() {
                return `${head()}
        <div class="thread vC">
          <div class="day">сегодня</div>
          ${bubble({ own: false, text: "Можно не стопкой. Давай героем — озеро крупно, остальное полоской.", time: "10:12" })}
          ${bubble({
              own: true,
              time: "10:14",
              status: "прочитано",
              label: "раскладка · герой",
              text: "как просила",
              mediaHtml: mosaic("hero", [
                  { media: img(P.lake) },
                  { media: img(P.forest) },
                  { media: img(P.cabin) },
                  { media: img(P.night), video: true, dur: "0:18" },
              ]),
              filesHtml: `<div class="files">${fileChip("smeta-izba.pdf", "240 КБ")}${fileChip("список покупок.md", "4 КБ", "📝")}</div>`,
          })}
          ${bubble({
              own: false,
              time: "10:16",
              label: "раскладка · журнал",
              mediaHtml: mosaic("magazine", [
                  { media: img(P.tea) },
                  { media: img(P.fire) },
                  { media: img(P.map), video: true, dur: "0:41" },
              ]),
              text: "наш ответный коллаж",
          })}
        </div>
        <aside class="media-rail">
          <h3>В этом чате</h3>
          <div class="rail-grid">
            <img src="${P.lake}" alt=""><img src="${P.forest}" alt="">
            <img src="${P.cabin}" alt=""><img src="${P.night}" alt="">
            <img src="${P.tea}" alt=""><img src="${P.fire}" alt="">
          </div>
          <p class="hint" style="margin-top:.7rem">Рельс не обязателен в v1. Полезен на широком экране: не надо открывать оверлей, чтобы вспомнить, что уже скидывали.</p>
        </aside>
        ${composer("C")}`;
            }

            const phone = document.getElementById("phone");
            const notes = document.getElementById("notes");
            let current = "A";

            function render(v) {
                current = v;
                phone.className = "phone" + (v === "C" ? " wide" : "");
                phone.innerHTML =
                    v === "A" ? viewA() : v === "B" ? viewB() : viewC();
                notes.innerHTML = NOTES[v];
                document
                    .querySelectorAll(".variant-switch button")
                    .forEach((b) =>
                        b.classList.toggle("is-on", b.dataset.v === v),
                    );
            }

            document
                .querySelector(".variant-switch")
                .addEventListener("click", (e) => {
                    const b = e.target.closest("button");
                    if (b) render(b.dataset.v);
                });
            document
                .getElementById("themeBtn")
                .addEventListener("click", () => {
                    const light =
                        document.documentElement.getAttribute("data-theme") !==
                        "light";
                    document.documentElement.setAttribute(
                        "data-theme",
                        light ? "light" : "dark",
                    );
                    document.getElementById("themeBtn").textContent = light
                        ? "Тёмная"
                        : "Светлая";
                });
            phone.addEventListener("click", (e) => {
                const lay = e.target.closest("[data-lay]");
                if (!lay) return;
                lay.parentElement
                    .querySelectorAll("button")
                    .forEach((b) => b.classList.toggle("is-on", b === lay));
            });
            render("A");
        </script>
    </body>
</html>
