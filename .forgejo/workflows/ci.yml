# Копия смысла .github/workflows/ci.yml.
# Когда появится git.ugolok.tech: включить Actions, поставить runner,
# сменить runs-on на лейбл своего runner-а, перенести секреты.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: ci-check
        run: bash scripts/ci-check.sh
