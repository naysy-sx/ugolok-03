# Push в dev → сразу test.ugolok.tech (PWA + тестовый relay/Blossom).
name: deploy-test

on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ugolok
    steps:
      - name: clone and deploy test.ugolok.tech
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORK="$(mktemp -d /tmp/ugolok-deploy-test.XXXXXX)"
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${TOKEN}@git.ugolok.tech/naysy/ugolok.git" "$WORK"
          cd "$WORK"
          bash scripts/deploy-env.sh test
          rm -rf "$WORK"
