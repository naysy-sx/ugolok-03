##
## strfry config — локальный тестовый relay проекта "Уголок" (этап 16+)
## Запускать через server/strfry/run.sh (устанавливает верный working
## directory, чтобы относительный путь db ниже резолвился корректно).
## Не редактировать strfry-src/strfry.conf (шаблон апстрима) — только этот файл.
##

db = "./strfry-db/"

dbParams {
    maxreaders = 256
    mapsize = 10995116277760
    noReadAhead = false
}

events {
    maxEventSize = 65536
    rejectEventsNewerThanSeconds = 900
    rejectEventsOlderThanSeconds = 94608000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    bind = "127.0.0.1"
    port = 7777
    nofiles = 524288
    realIpHeader = ""

    auth {
        # NIP-42 включён — проект тестирует и ветку "relay требует AUTH" (этап 17,
        # AC-14), и ветку "relay AUTH не требует" (публичные relay), см. обсуждение
        # в log.md/CONTRACTS.md этапа 16.
        enabled = true
        serviceUrl = "ws://127.0.0.1:7777"
    }

    info {
        name = "ugolok-test-relay"
        description = "Локальный strfry для разработки и тестирования Уголка (этапы 16+). Не для продакшена."
        pubkey = ""
        self = ""
        contact = ""
        icon = ""
        banner = ""
        privacy = ""
        terms = ""
        nips = ""
    }

    maxWebsocketPayloadSize = 131072
    maxReqFilterSize = 200
    autoPingSeconds = 55
    enableTcpKeepalive = false
    queryTimesliceBudgetMicroseconds = 10000
    # НАЙДЕНО ЖИВЫМ ЗАМЕРОМ (этап 34, AC-12/13): дефолт 500 молча обрезает ЛЮБОЙ
    # REQ-фильтр без явного limit — giftWrapSubscriber/bootstrap.js/channel-
    # подписки (transport.js) все используют фильтры БЕЗ limit (нет пагинации
    # через until-курсор в клиенте, backlog — см. PLAN.md/CONTRACTS.md, этап 34).
    # На дефолте 500 клиент с >500 накопленными gift-wrap событиями молча НЕ
    # получает более старые — не ошибка на клиенте, событие просто никогда не
    # приходит. Для НАШЕГО relay (свой, локальная сеть, не публичный сервис,
    # не нужно защищаться от abuse строгим лимитом) — увеличено с запасом.
    # На ЧУЖОМ relay (пользователь не контролирует конфиг) это ограничение
    # всё ещё актуально — правильное решение уровня клиента (пагинация) не
    # реализовано, см. явное сужение скоупа.
    maxFilterLimit = 10000
    maxTagsPerFilter = 3
    maxFilterLimitCount = 1000000
    maxSubsPerConnection = 200
    maxPendingOutboundBytes = 33554432

    writePolicy {
        # Whitelist по event.pubkey (не по NIP-42 authed) — решение пользователя,
        # обоснование в DESIGN.md/CONTRACTS.md этапа 17 (strfry по своей
        # документации/архитектуре не привязывает write-whitelist к AUTH).
        # whitelist.json по умолчанию — ["*"] (allow-all): локальный dev-relay не
        # должен требовать ручного добавления pubkey просто чтобы попробовать
        # приложение (найдено на реальном использовании — контакт не добавлялся
        # с "blocked: pubkey not on whitelist" для только что созданного аккаунта).
        # Чтобы проверить САМ механизм whitelist (deny-by-default, AC-14, этап 17) —
        # заменить содержимое файла на конкретный список pubkey, тесты делают это
        # динамически и сбрасывают обратно.
        plugin = "./whitelist-plugin.mjs"
        timeoutSeconds = 10
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = true
    }

    numThreads {
        ingester = 3
        reqWorker = 3
        reqMonitor = 3
        negentropy = 2
    }

    negentropy {
        enabled = true
        maxSyncEvents = 1000000
    }

    filterValidation {
        enabled = false
        maxFiltersPerReq = 3
        minFiltersPerReq = 1
        maxKindsPerFilter = 3
        allowedKinds = ""
        requireAuthorOrTag = false
    }
}
