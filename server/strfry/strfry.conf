##
## strfry config — локальный тестовый relay проекта "Уголок" (этап 16+)
## Запускать через server/strfry/run.sh (устанавливает верный working
## directory, чтобы относительный путь db ниже резолвился корректно).
## Не редактировать strfry-src/strfry.conf (шаблон апстрима) — только этот файл.
##

db = "./strfry-db/"

dbParams {
    maxreaders = 256
    mapsize = 10995116277760
    noReadAhead = false
}

events {
    maxEventSize = 65536
    rejectEventsNewerThanSeconds = 900
    rejectEventsOlderThanSeconds = 94608000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    bind = "127.0.0.1"
    port = 7777
    nofiles = 524288
    realIpHeader = ""

    auth {
        # NIP-42 включён — проект тестирует и ветку "relay требует AUTH" (этап 17,
        # AC-14), и ветку "relay AUTH не требует" (публичные relay), см. обсуждение
        # в log.md/CONTRACTS.md этапа 16.
        enabled = true
        serviceUrl = "ws://127.0.0.1:7777"
    }

    info {
        name = "ugolok-test-relay"
        description = "Локальный strfry для разработки и тестирования Уголка (этапы 16+). Не для продакшена."
        pubkey = ""
        self = ""
        contact = ""
        icon = ""
        banner = ""
        privacy = ""
        terms = ""
        nips = ""
    }

    maxWebsocketPayloadSize = 131072
    maxReqFilterSize = 200
    autoPingSeconds = 55
    enableTcpKeepalive = false
    queryTimesliceBudgetMicroseconds = 10000
    maxFilterLimit = 500
    maxTagsPerFilter = 3
    maxFilterLimitCount = 1000000
    maxSubsPerConnection = 200
    maxPendingOutboundBytes = 33554432

    writePolicy {
        # Пусто = принимать любое событие от аутентифицированного (AUTH) клиента.
        # Реальный whitelist-плагин (проверка pubkey из AC-14) — этап 17, отдельным
        # решением: whitelist где-то должен храниться и синхронизироваться с
        # клиентской моделью угроз, это содержательный вопрос того этапа, не
        # заглушка "для галочки" здесь.
        plugin = ""
        timeoutSeconds = 10
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = true
    }

    numThreads {
        ingester = 3
        reqWorker = 3
        reqMonitor = 3
        negentropy = 2
    }

    negentropy {
        enabled = true
        maxSyncEvents = 1000000
    }

    filterValidation {
        enabled = false
        maxFiltersPerReq = 3
        minFiltersPerReq = 1
        maxKindsPerFilter = 3
        allowedKinds = ""
        requireAuthorOrTag = false
    }
}
