# Локальный TURN/STUN для `npm run dev`. Только 127.0.0.1 — не LAN и не
# публичный интернет. user=ugolok:ugolok-dev — статичные dev-креды, НЕ
# продакшен use-auth-secret агента (agent/compose/coturn.conf.tmpl).
listening-ip=127.0.0.1
relay-ip=127.0.0.1
external-ip=127.0.0.1
listening-port=3478
min-port=49160
max-port=49200
fingerprint
lt-cred-mech
user=ugolok:ugolok-dev
realm=ugolok.local
no-cli
no-tls
no-dtls
pidfile=./turnserver.pid
