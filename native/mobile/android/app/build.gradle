apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Релиз-пайплайн (TZ-release-pipeline) — versionCode обязан строго
// возрастать от релиза к релизу, иначе Android откажется ставить
// "обновление" поверх старой версии (придётся удалять приложение).
// git rev-list --count — монотонно растёт с историей, не зависит от тегов.
def releaseVersionCode = System.getenv("ANDROID_VERSION_CODE")?.toInteger()
    ?: ['git', 'rev-list', '--count', 'HEAD'].execute().text.trim().toInteger()
def releaseVersionName = System.getenv("ANDROID_VERSION_NAME") ?: "1.0"

android {
    namespace = "tech.ugolok.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "tech.ugolok.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseVersionCode
        versionName releaseVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // TZ-release-pipeline — подпись через переменные окружения (CI secrets
    // или локальная оболочка разработчика), не через закоммиченный keystore.
    // Без всех четырёх переменных release собирается НЕПОДПИСАННЫМ, как и
    // раньше (см. .github/workflows/native-android-build.yml, Э4) — это
    // осознанный fallback для CI-проверки "просто компилируется", а не для
    // публикации. Публикуемый релиз обязан идти с заданными переменными.
    def storeFilePath = System.getenv("RELEASE_STORE_FILE")
    def hasReleaseSigning = storeFilePath && System.getenv("RELEASE_STORE_PASSWORD") &&
        System.getenv("RELEASE_KEY_ALIAS") && System.getenv("RELEASE_KEY_PASSWORD")
    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(storeFilePath)
                storePassword System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    } else {
        logger.warn("RELEASE_STORE_FILE и сопутствующие переменные не заданы — release APK/AAB будет неподписанным (годится для CI-проверки сборки, не для публикации)")
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    // Э-PUSH П2 — jvmTarget синхронизирован с compileOptions.sourceCompatibility/
    // targetCompatibility (JavaVersion.VERSION_21), которые задаёт сгенерированный
    // capacitor.build.gradle (apply from: ниже) — рассинхрон даёт ошибку сборки
    // "inconsistent JVM-target compatibility".
    kotlinOptions {
        jvmTarget = "21"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Э-PUSH П2.1/П2.4 — ProcessLifecycleOwner (UgolokPushService: "если
    // интерфейс приложения сейчас на экране — ничего не показывать").
    implementation "androidx.lifecycle:lifecycle-process:2.6.2"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
