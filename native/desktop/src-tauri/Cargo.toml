[package]
name = "ugolok-desktop"
version = "0.1.0"
description = "Уголок — desktop-приложение (Windows/macOS/Linux, Tauri 2)"
authors = []
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# Э3, найдено живьём (владелец, Mac mini, 2026-09-27) — macOS App Nap
# обрывает WebSocket relay-соединение (code 1005) короткими циклами, даже
# пока окно приложения на экране, если оно не в фокусе (напр. открыт
# инспектор). NSAppSleepDisabled в Info.plist это НЕ лечит (задокументированный
# факт — сама App Nap работает на уровне процесса, не декларации в plist) —
# нужен настоящий activity-токен через NSProcessInfo, см. lib.rs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString"] }
